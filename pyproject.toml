[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raposa-mcp"
version = "0.1.0"
description = "MCP server for Raposa Aval: give your agent a request_human_approval tool with a signed audit trail."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DC ESCRYPT SL", email = "contact@raposa.group" }]
keywords = ["mcp", "human-in-the-loop", "approval", "ai-agents", "audit"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.urls]
Homepage = "https://raposa.group"
Documentation = "https://raposa.group/docs/"
Source = "https://github.com/agentlabbusiness/raposa-mcp"

[project.scripts]
raposa-mcp = "raposa_mcp.server:main"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
